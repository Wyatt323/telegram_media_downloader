services:
  telegram_media_downloader:
    image: ghcr.io/wyatt323/telegram_media_downloader:latest
    container_name: telegram_media_downloader
    restart: unless-stopped

    # Web UI（如不需要，可删除 ports 整段）
    ports:
      - "5000:5000"

    # 如需 Telegram 代理，取消注释并填写实际地址。
    # environment:
    #   http_proxy: http://host.docker.internal:7890
    #   https_proxy: http://host.docker.internal:7890
    #   no_proxy: localhost,127.0.0.1

    volumes:
      # 下载的媒体文件
      - ./downloads:/app/downloads

      # 下载器的主配置与任务进度。
      # last_read_message_id 会写入 config.yaml；失败重试列表会写入 data.yaml。
      - ./config.yaml:/app/config.yaml
      - ./data.yaml:/app/data.yaml

      # 应用日志、Telegram 登录会话、下载临时文件
      - ./log:/app/log
      - ./sessions:/app/sessions
      - ./temp:/app/temp

      # 仅在 config.yaml 启用 upload_adapter: rclone 时需要。
      # rclone.conf 应放在 ./rclone/ 目录内。
      - ./rclone:/root/.config/rclone
